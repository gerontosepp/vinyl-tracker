name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 24
      uses: actions/setup-java@v4
      with:
        java-version: '24'
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Build and Test with Maven
      # The jacoco-check goal is bound to the verify phase, so 'mvn verify' will trigger the coverage check and fail if < 80%
      run: mvn clean verify

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: Run Tests
      # --coverage flag triggers coverage collection. Vitest config has thresholds set to failure if < 80% lines
      run: npm run test -- --coverage

    - name: Build Frontend
      run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci --legacy-peer-deps

    - name: Install Playwright Browsers
      working-directory: ./frontend
      run: npx playwright install chromium --with-deps

    - name: Start Backend Services
      run: docker compose up -d backend postgres
      env:
        POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'postgres' }}
        POSTGRES_USER: ${{ secrets.DB_USER || 'postgres' }}
        POSTGRES_DB: ${{ secrets.DB_NAME || 'vinyl_tracker' }}
        VINYL_ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD || 'deadbeefdeadbeefdeadbeefdeadbeef' }}
        VINYL_ENCRYPTION_SALT: ${{ secrets.ENCRYPTION_SALT || 'deadbeefdeadbeef' }}
        DISCONGS_TOKEN: ${{ secrets.DISCOGS_TOKEN || 'dummy_token' }}
        DISCOGS_USERNAME: ${{ secrets.DISCOGS_USERNAME || 'dummy_user' }}

    - name: Wait for Backend
      run: |
        timeout 60s bash -c 'until curl --output /dev/null --silent --head --fail http://localhost:8080/actuator/health; do sleep 5; done' || echo "Backend did not start in time or health check failed"
      shell: bash

    - name: Run E2E Tests
      working-directory: ./frontend
      run: npm run test:e2e
      env:
        # Override Base URL if needed, but playwright config uses localhost:5173 which npm run dev will serve
        CI: true

    - name: Upload Playwright Report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 5
