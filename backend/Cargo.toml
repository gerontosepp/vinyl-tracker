[package]
name = "backend-rs"
version = "0.10.0"
edition = "2024"

[workspace]
members = ["crates/vinyl-api-types"]
# `cargo test` / `clippy` / `llvm-cov` in backend/ also cover the shared API types crate
default-members = [".", "crates/vinyl-api-types"]

[dependencies]
vinyl-api-types = { path = "crates/vinyl-api-types" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Database & Migrations (sqlx::migrate, see build.rs)
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }

# Serialization & Datetime
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Observability & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config & Environment
dotenvy = "0.15"

# Security, Auth & Crypto
bcrypt = "0.17"
jsonwebtoken = "9"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = "0.12"
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["block-padding"] }
hex = "0.4"
rand = "0.8"

# HTTP Client, Rate-Limiting & Caching
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"
governor = "0.10"
moka = { version = "0.12", features = ["future"] }
futures-util = "0.3"
url = "2.5"
ipnet = "2"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"
fast_qr = { version = "0.14.0", features = ["svg"] }
printpdf = "0.12.8"
tokio-tungstenite = "0.30.0"

[dev-dependencies]
http-body-util = "0.1"
lopdf = "0.44"

[profile.test]
debug = 1
