name: Auto Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v prefix, e.g. 0.3.0)'
        required: false
        default: ''

jobs:
  create-release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      created: ${{ steps.check_release.outputs.exists == 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get version from package.json
        id: get_version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(jq -r .version frontend/package.json)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.get_version.outputs.VERSION }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG_NAME does not exist. Creating."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.get_version.outputs.VERSION }}"
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            --target main

  mcp-release:
    name: MCP Server Release (${{ matrix.target }})
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            binary: vinyl-mcp-server
          - os: macos-latest
            target: macos-aarch64
            binary: vinyl-mcp-server
    defaults:
      run:
        working-directory: ./mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: resolve_tag
        run: |
          VERSION="${{ inputs.version || needs.create-release.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(jq -r .version ../frontend/package.json)
          fi
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT
          echo "Building MCP binaries for tag v$VERSION"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./mcp -> ./mcp/target"

      - name: Build Release Binary
        run: cargo build --release

      - name: Package & Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCHIVE_NAME="vinyl-mcp-server-${{ matrix.target }}.tar.gz"
          tar -czf "../$ARCHIVE_NAME" -C target/release "${{ matrix.binary }}"
          gh release upload "${{ steps.resolve_tag.outputs.TAG_NAME }}" "../$ARCHIVE_NAME" --clobber
