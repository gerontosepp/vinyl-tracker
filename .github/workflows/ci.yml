name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Check Docker
      run: docker info

    - name: Build and Test with Maven
      # The jacoco-check goal is bound to the verify phase, so 'mvn verify' will trigger the coverage check and fail if < 80%
      env:
        DOCKER_HOST: unix:///var/run/docker.sock
      run: mvn clean verify -Dorg.slf4j.simpleLogger.log.org.testcontainers=debug

    - name: Set up Docker Buildx
      if: startsWith(github.ref, 'refs/tags/v')
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: startsWith(github.ref, 'refs/tags/v')
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      if: startsWith(github.ref, 'refs/tags/v')
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/vinyl-tracker-backend

    - name: Build and Push Backend Image
      if: startsWith(github.ref, 'refs/tags/v')
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels:  ${{ steps.meta.outputs.labels }}

  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: Run Tests
      # --coverage flag triggers coverage collection. Vitest config has thresholds set to failure if < 80% lines
      run: npm run test -- --coverage

    # We build the Docker image which includes the build step, so explicit 'npm run build' is redundant for the artifact if we just want the image.
    # But sticking to the pattern:
    
    - name: Set up Docker Buildx
      if: startsWith(github.ref, 'refs/tags/v')
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: startsWith(github.ref, 'refs/tags/v')
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      if: startsWith(github.ref, 'refs/tags/v')
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/vinyl-tracker-frontend

    - name: Build and Push Frontend Image
      if: startsWith(github.ref, 'refs/tags/v')
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        target: production
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  cleanup-ghcr:
    needs: [backend-build, frontend-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Delete old backend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'vinyl-tracker-backend'
          package-type: 'container'
          min-versions-to-keep: 3

      - name: Delete old frontend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'vinyl-tracker-frontend'
          package-type: 'container'
          min-versions-to-keep: 3


