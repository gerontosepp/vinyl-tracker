name: CI Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests & Linting (Linux)
    # Skip redundant test execution on PRs from develop (develop is already fully tested on push)
    if: github.event_name != 'pull_request' || github.head_ref != 'develop'
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (no release tags)
      with:
        toolchain: stable
        components: clippy, rustfmt, llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: cargo-llvm-cov

    - name: Rust Cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: "./backend -> ./backend/target"

    - name: Check Formatting
      run: cargo fmt -- --check

    - name: Run Cargo Check
      run: cargo check

    - name: Run Clippy Linter
      run: cargo clippy -- -D warnings

    - name: Start PostgreSQL Test Container
      run: |
        PG_CONTAINER="test-postgres-rs-${{ github.run_id }}-${{ github.run_attempt }}"
        echo "PG_CONTAINER=$PG_CONTAINER" >> $GITHUB_ENV
        docker rm -f "$PG_CONTAINER" 2>/dev/null || true
        docker run -d --name "$PG_CONTAINER" \
          -e POSTGRES_DB=vinyl_tracker \
          -e POSTGRES_USER=vinyl_user \
          -e POSTGRES_PASSWORD=vinyl_password \
          -p 127.0.0.1::5432 \
          postgres:17-alpine

        # Wait until PostgreSQL process is ready
        for i in {1..30}; do
          if docker exec "$PG_CONTAINER" pg_isready -U vinyl_user -d vinyl_tracker; then
            echo "PostgreSQL is accepting connections!"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 1
        done

        # If runner container is in a custom docker network, connect test container to it
        RUNNER_ID=$(cat /etc/hostname 2>/dev/null || hostname)
        RUNNER_NET=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$RUNNER_ID" 2>/dev/null | head -n 1 || echo "")
        if [ -n "$RUNNER_NET" ] && [ "$RUNNER_NET" != "bridge" ] && [ "$RUNNER_NET" != "host" ] && [ "$RUNNER_NET" != "none" ]; then
          echo "Connecting $PG_CONTAINER to runner network: $RUNNER_NET"
          docker network connect "$RUNNER_NET" "$PG_CONTAINER" 2>/dev/null || true
        fi

        # Extract container IP & gateway
        RUNNER_NET_IP=""
        if [ -n "$RUNNER_NET" ] && [ "$RUNNER_NET" != "bridge" ] && [ "$RUNNER_NET" != "host" ] && [ "$RUNNER_NET" != "none" ]; then
          RUNNER_NET_IP=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{if eq $k "'$RUNNER_NET'"}}{{$v.IPAddress}}{{end}}{{end}}' "$PG_CONTAINER" 2>/dev/null || echo "")
        fi
        PG_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$PG_CONTAINER" | awk '{print $1}')
        HOST_GATEWAY=$(ip route 2>/dev/null | awk '/default/ {print $3}' || echo "172.17.0.1")
        MAPPED_PORT=$(docker port "$PG_CONTAINER" 5432 2>/dev/null | head -n 1 | awk -F: '{print $NF}' || echo "")

        echo "Discovering working PostgreSQL connection endpoint..."
        echo "Runner Network IP: $RUNNER_NET_IP"
        echo "Container IP: $PG_IP"
        echo "Host Gateway: $HOST_GATEWAY"
        echo "Mapped Port: $MAPPED_PORT"

        TARGETS=()
        [ -n "$RUNNER_NET_IP" ] && TARGETS+=("$RUNNER_NET_IP:5432")
        [ -n "$PG_IP" ] && TARGETS+=("$PG_IP:5432")
        TARGETS+=("$PG_CONTAINER:5432")
        if [ -n "$MAPPED_PORT" ]; then
          TARGETS+=("$HOST_GATEWAY:$MAPPED_PORT" "127.0.0.1:$MAPPED_PORT" "localhost:$MAPPED_PORT")
        fi

        SELECTED_URL=""
        for target in "${TARGETS[@]}"; do
          host="${target%:*}"
          port="${target#*:}"
          if (exec 3<>/dev/tcp/$host/$port) 2>/dev/null; then
            exec 3<&-
            exec 3>&-
            echo "VERIFIED: Reachable at $host:$port"
            SELECTED_URL="postgres://vinyl_user:vinyl_password@$host:$port/vinyl_tracker"
            break
          else
            echo "Could not connect to $host:$port"
          fi
        done

        if [ -z "$SELECTED_URL" ]; then
          echo "ERROR: Failed to establish a TCP connection to PostgreSQL!"
          exit 1
        fi

        echo "DATABASE_URL=$SELECTED_URL" >> $GITHUB_ENV
        echo "Configured DATABASE_URL in GITHUB_ENV: $SELECTED_URL"

    - name: Run Backend Tests & Enforce Coverage (>= 80%)
      env:
        CARGO_BUILD_JOBS: 2
        JWT_SECRET: superSecretDevelopmentKeyDoNotUseInProduction123!
        VINYL_ENCRYPTION_PASSWORD: changeit-for-production-use-23948239048
        VINYL_ENCRYPTION_SALT: 5c074494c45680a7
      run: |
        echo "Running tests with DATABASE_URL: $DATABASE_URL"
        cargo llvm-cov --summary-only --fail-under-lines 80

    - name: Stop PostgreSQL Test Container
      if: always()
      run: docker rm -f "$PG_CONTAINER" || true

  frontend-test:
    name: Frontend Tests & Build (Linux)
    # Skip redundant test execution on PRs from develop (develop is already fully tested on push)
    if: github.event_name != 'pull_request' || github.head_ref != 'develop'
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Set up Chrome
      id: setup-chrome
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      with:
        chrome-version: stable
        install-dependencies: true

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: Run Karma Unit Tests
      # Runs Angular Karma unit tests with > 80% coverage check enforced via karma.conf.js
      env:
        CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
      run: npm run test -- --watch=false --code-coverage --browsers=ChromeHeadlessCI

    - name: Cache Playwright Browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      env:
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "180000"
        NODE_OPTIONS: "--dns-result-order=ipv4first"
      run: npx playwright install --with-deps chromium

    - name: Install Playwright System Dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Ensure Development Certificates
      run: node scripts/ensure-certs.js

    - name: Run Playwright E2E Tests
      run: npm run test:e2e

    - name: Verify Frontend Production Build
      run: npm run build

  mcp-test:
    name: MCP Server Tests (Linux)
    # Skip redundant test execution on PRs from develop (develop is already fully tested on push)
    if: github.event_name != 'pull_request' || github.head_ref != 'develop'
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: ./mcp

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (no release tags)
      with:
        toolchain: stable
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: "./mcp -> ./mcp/target"

    - name: Check Formatting
      run: cargo fmt -- --check

    - name: Run Cargo Check
      run: cargo check

    - name: Run Unit Tests
      run: cargo test --verbose

  publish-images:
    name: Build & Publish Container Images (Multi-Arch)
    needs: [backend-test, frontend-test, mcp-test]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract project version
        id: project_version
        run: |
          VERSION=$(jq -r .version frontend/package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Project version is $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Backend
        id: meta_backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/vinyl-tracker-backend
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ steps.project_version.outputs.VERSION }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Extract metadata (tags, labels) for Frontend
        id: meta_frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/vinyl-tracker-frontend
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ steps.project_version.outputs.VERSION }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  cleanup-ghcr:
    name: Cleanup GHCR Packages
    needs: [publish-images]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Cleanup old container images (multi-arch safe)
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: 'vinyl-tracker-backend,vinyl-tracker-frontend'
          token: ${{ secrets.GITHUB_TOKEN }}
          keep-n-tagged: 5
          delete-ghost-images: true
          delete-orphaned-images: true
          delete-untagged: true



