# Test Configuration
# Uses H2 database for testing by default, or Testcontainers
# H2 configuration commented out in favor of Testcontainers
# spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.hibernate.ddl-auto=create-drop

# Dummy secrets for testing
vinyl.encryption.password=test-password-1234567890123456
vinyl.encryption.salt=1234567890abcdef

# CORS defaults for tests
cors.allowed-origins=https://localhost:5173,https://127.0.0.1:5173
cors.allow-credentials=false

# Image proxy defaults for tests
image-proxy.allowed-hosts=i.discogs.com,s.discogs.com,api.discogs.com

# JWT defaults for tests
jwt.secret=test-secret-key-for-tests-1234567890

# Auth cookie defaults for tests
auth.cookie.name=vinyl_token
auth.cookie.max-age-seconds=86400
auth.cookie.secure=false
auth.cookie.same-site=Lax
