spring.application.name=vinyl-tracker-backend
# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.info.enabled=true
management.info.git.enabled=true
management.info.build.enabled=true
management.endpoint.env.enabled=false
management.endpoint.configprops.enabled=false
management.info.git.mode=full

vinyl.encryption.password=${VINYL_ENCRYPTION_PASSWORD}
vinyl.encryption.salt=${VINYL_ENCRYPTION_SALT}

# Comma-separated allowlist (no wildcard). Override via CORS_ALLOWED_ORIGINS.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://localhost:5173,https://127.0.0.1:5173}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# Comma-separated allowlist for image proxy target hosts.
image-proxy.allowed-hosts=${IMAGE_PROXY_ALLOWED_HOSTS:i.discogs.com,s.discogs.com,api.discogs.com}

# HttpOnly auth cookie configuration.
auth.cookie.name=${AUTH_COOKIE_NAME:vinyl_token}
auth.cookie.max-age-seconds=${AUTH_COOKIE_MAX_AGE_SECONDS:86400}
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# JPA / Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Security & Optimization Defaults
spring.jpa.open-in-view=false
server.error.include-stacktrace=never

# Caching Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h

# Resilience4j Discord RateLimiter and Retry
resilience4j.ratelimiter.instances.discogs.limitForPeriod=60
resilience4j.ratelimiter.instances.discogs.limitRefreshPeriod=1m
resilience4j.ratelimiter.instances.discogs.timeoutDuration=60s
resilience4j.retry.instances.discogs.maxAttempts=3
resilience4j.retry.instances.discogs.waitDuration=2s
resilience4j.retry.instances.discogs.enableExponentialBackoff=true
resilience4j.retry.instances.discogs.exponentialBackoffMultiplier=2
resilience4j.retry.instances.discogs.retryExceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.discogs.retryExceptions[1]=org.springframework.web.client.HttpClientErrorException$TooManyRequests
resilience4j.retry.instances.discogs.retryExceptions[2]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.discogs.retryExceptions[3]=java.io.IOException

# OpenAPI / Swagger UI Config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
