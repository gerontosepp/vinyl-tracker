name: CI Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend Build, Test & Docker Publish (Linux)
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./backend -> ./backend/target"

    - name: Run Cargo Check
      run: cargo check

    - name: Run Clippy Linter
      run: cargo clippy -- -D warnings

    - name: Start PostgreSQL Test Container
      run: |
        docker rm -f test-postgres-rs 2>/dev/null || true
        docker run -d --name test-postgres-rs \
          -e POSTGRES_DB=vinyl_tracker \
          -e POSTGRES_USER=vinyl_user \
          -e POSTGRES_PASSWORD=vinyl_password \
          -p 54329:5432 \
          postgres:17-alpine

        # Wait until PostgreSQL process is ready
        for i in {1..30}; do
          if docker exec test-postgres-rs pg_isready -U vinyl_user -d vinyl_tracker; then
            echo "PostgreSQL is accepting connections!"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 1
        done

        # If runner container is in a custom docker network, connect test-postgres-rs to it
        RUNNER_ID=$(cat /etc/hostname 2>/dev/null || hostname)
        RUNNER_NET=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$RUNNER_ID" 2>/dev/null | head -n 1 || echo "")
        if [ -n "$RUNNER_NET" ] && [ "$RUNNER_NET" != "bridge" ] && [ "$RUNNER_NET" != "host" ] && [ "$RUNNER_NET" != "none" ]; then
          echo "Connecting test-postgres-rs to runner network: $RUNNER_NET"
          docker network connect "$RUNNER_NET" test-postgres-rs 2>/dev/null || true
        fi

        # Extract container IP & gateway
        RUNNER_NET_IP=""
        if [ -n "$RUNNER_NET" ] && [ "$RUNNER_NET" != "bridge" ] && [ "$RUNNER_NET" != "host" ] && [ "$RUNNER_NET" != "none" ]; then
          RUNNER_NET_IP=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{if eq $k "'$RUNNER_NET'"}}{{$v.IPAddress}}{{end}}{{end}}' test-postgres-rs 2>/dev/null || echo "")
        fi
        PG_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' test-postgres-rs | awk '{print $1}')
        HOST_GATEWAY=$(ip route 2>/dev/null | awk '/default/ {print $3}' || echo "172.17.0.1")

        echo "Discovering working PostgreSQL connection endpoint..."
        echo "Runner Network IP: $RUNNER_NET_IP"
        echo "Container IP: $PG_IP"
        echo "Host Gateway: $HOST_GATEWAY"

        TARGETS=()
        [ -n "$RUNNER_NET_IP" ] && TARGETS+=("$RUNNER_NET_IP:5432")
        [ -n "$PG_IP" ] && TARGETS+=("$PG_IP:5432")
        TARGETS+=("test-postgres-rs:5432" "$HOST_GATEWAY:54329" "127.0.0.1:54329" "localhost:54329")

        SELECTED_URL=""
        for target in "${TARGETS[@]}"; do
          host="${target%:*}"
          port="${target#*:}"
          if (exec 3<>/dev/tcp/$host/$port) 2>/dev/null; then
            exec 3<&-
            exec 3>&-
            echo "VERIFIED: Reachable at $host:$port"
            SELECTED_URL="postgres://vinyl_user:vinyl_password@$host:$port/vinyl_tracker"
            break
          else
            echo "Could not connect to $host:$port"
          fi
        done

        if [ -z "$SELECTED_URL" ]; then
          echo "ERROR: Failed to establish a TCP connection to PostgreSQL!"
          exit 1
        fi

        echo "DATABASE_URL=$SELECTED_URL" >> $GITHUB_ENV
        echo "Configured DATABASE_URL in GITHUB_ENV: $SELECTED_URL"

    - name: Run Backend Integration & Unit Tests
      env:
        CARGO_BUILD_JOBS: 2
        JWT_SECRET: superSecretDevelopmentKeyDoNotUseInProduction123!
        VINYL_ENCRYPTION_PASSWORD: changeit-for-production-use-23948239048
        VINYL_ENCRYPTION_SALT: 5c074494c45680a7
      run: |
        echo "Running tests with DATABASE_URL: $DATABASE_URL"
        cargo test --verbose

    - name: Stop PostgreSQL Test Container
      if: always()
      run: docker rm -f test-postgres-rs || true

    - name: Extract project version
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      id: project_version
      run: |
        VERSION=$(jq -r .version ../frontend/package.json)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Project version is $VERSION"

    - name: Set up QEMU
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/vinyl-tracker-backend
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          type=raw,value=v${{ steps.project_version.outputs.VERSION }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          type=semver,pattern={{version}}

    - name: Build and Push Backend Image
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}


  frontend-build:
    needs: [backend-build]
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Set up Chrome
      id: setup-chrome
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: stable
        install-dependencies: true

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: Run Karma Unit Tests
      # Runs Angular Karma unit tests with > 80% coverage check enforced via karma.conf.js
      env:
        CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
      run: npm run test -- --watch=false --code-coverage --browsers=ChromeHeadlessCI

    - name: Install Playwright Browsers
      env:
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "180000"
        NODE_OPTIONS: "--dns-result-order=ipv4first"
      run: npx playwright install --with-deps chromium

    - name: Ensure Development Certificates
      run: node scripts/ensure-certs.js

    - name: Run Playwright E2E Tests
      run: npm run test:e2e

    # We build the Docker image which includes the build step, so explicit 'npm run build' is redundant for the artifact if we just want the image.
    # But sticking to the pattern:
    
    - name: Extract project version
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      id: project_version
      run: |
        VERSION=$(jq -r .version package.json)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Project version is $VERSION"

    - name: Set up QEMU
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/vinyl-tracker-frontend
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          type=raw,value=v${{ steps.project_version.outputs.VERSION }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          type=semver,pattern={{version}}

    - name: Build and Push Frontend Image
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        target: production
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  mcp-test:
    name: MCP Server Tests (Linux)
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: ./mcp

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./mcp -> ./mcp/target"

    - name: Run Cargo Check
      run: cargo check

    - name: Run Unit Tests
      run: cargo test --verbose

  cleanup-ghcr:
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Delete old backend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'vinyl-tracker-backend'
          package-type: 'container'
          min-versions-to-keep: 3

      - name: Delete old frontend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'vinyl-tracker-frontend'
          package-type: 'container'
          min-versions-to-keep: 3



