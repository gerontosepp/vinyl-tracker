services:
  postgres:
    image: postgres:16
    container_name: vinyl-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: vinyl-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      VINYL_ENCRYPTION_PASSWORD: ${VINYL_ENCRYPTION_PASSWORD}
      VINYL_ENCRYPTION_SALT: ${VINYL_ENCRYPTION_SALT}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: vinyl-frontend
    environment:
      - VITE_API_TARGET=http://backend:8080
    ports:
      - "3000:3000" # Vite default (or 80 via nginx)
      - "5173:5173" # Dev server
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./certs:/app/certs

volumes:
  postgres_data:
