spring.application.name=vinyl-tracker-backend
# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.info.enabled=true
management.info.git.enabled=true
management.info.build.enabled=true
management.endpoint.env.enabled=false
management.endpoint.configprops.enabled=false
management.info.git.mode=full

vinyl.encryption.password=${VINYL_ENCRYPTION_PASSWORD}
vinyl.encryption.salt=${VINYL_ENCRYPTION_SALT}

# Comma-separated allowlist (no wildcard). Override via CORS_ALLOWED_ORIGINS.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://localhost:5173,https://127.0.0.1:5173}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# Comma-separated allowlist for image proxy target hosts.
image-proxy.allowed-hosts=${IMAGE_PROXY_ALLOWED_HOSTS:i.discogs.com,s.discogs.com,api.discogs.com}

# HttpOnly auth cookie configuration.
auth.cookie.name=${AUTH_COOKIE_NAME:vinyl_token}
auth.cookie.max-age-seconds=${AUTH_COOKIE_MAX_AGE_SECONDS:86400}
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# JPA / Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Security & Optimization Defaults
spring.jpa.open-in-view=false
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false
