services:
  postgres:
    image: postgres:16
    container_name: vinyl-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend-rs
    container_name: vinyl-backend
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VINYL_ENCRYPTION_PASSWORD: ${VINYL_ENCRYPTION_PASSWORD}
      VINYL_ENCRYPTION_SALT: ${VINYL_ENCRYPTION_SALT}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,https://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      CORS_ALLOW_CREDENTIALS: "true"
      RUST_LOG: info,backend_rs=debug,tower_http=info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: vinyl-frontend
    environment:
      - VITE_API_TARGET=http://backend:8080
    ports:
      - "3000:3000" # Vite default (or 80 via nginx)
      - "5173:5173" # Dev server
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./certs:/app/certs

volumes:
  postgres_data:
