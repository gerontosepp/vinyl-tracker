<!-- Mobile list (the table takes over from md): compact rows with a small cover -->
<ul class="flex md:hidden flex-col gap-1.5 pb-4" data-testid="collection-card-list">
  @for (release of releases(); track release.id; let idx = $index) {
    <li
      class="animate-slide-up"
      [style.animationDelay]="(idx % 12) * 50 + 'ms'"
      style="opacity: 0"
    >
      <button
        type="button"
        (click)="openDetail.emit(release)"
        class="group w-full text-left flex items-center gap-3 p-2 min-h-[56px] bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-xl transition-colors cursor-pointer hover:border-indigo-300 dark:hover:border-indigo-600"
        [attr.aria-label]="release.basic_information.title + ' – Details'"
      >
        <span
          class="w-12 h-12 shrink-0 bg-slate-100 dark:bg-slate-700/50 rounded-lg overflow-hidden flex items-center justify-center"
          data-testid="card-cover"
        >
          @if (release.basic_information.thumb) {
            <img
              [src]="apiService.getProxiedImageUrl(release.basic_information.thumb)"
              alt=""
              class="w-full h-full object-cover"
              loading="lazy"
            />
          } @else {
            <span class="text-xl opacity-50 grayscale" aria-hidden="true">💿</span>
          }
        </span>

        <span class="flex-1 min-w-0 flex flex-col gap-0.5">
          <span
            class="font-bold text-slate-900 dark:text-slate-100 truncate text-sm leading-tight group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors"
            [title]="release.basic_information.title"
          >
            {{ release.basic_information.title }}
          </span>
          <span class="text-xs text-slate-500 dark:text-slate-400 truncate font-medium">
            {{ release.basic_information.artists.length > 0 ? release.basic_information.artists[0].name : 'Unknown' }} ·
            {{ release.basic_information.year || '—' }}
          </span>
          @if (release.storage; as slot) {
            <span
              class="text-[10px] font-semibold truncate"
              [class]="slot.unplaced ? 'text-amber-600 dark:text-amber-400' : 'text-indigo-600 dark:text-indigo-400'"
              data-testid="card-storage"
            >
              🗄️ {{ slot | storageSlot: true }}
            </span>
          }
          @if (release.media_condition || release.sleeve_condition || release.basic_information.median_price != null) {
            <span class="flex items-center gap-1 text-[10px] min-w-0 overflow-hidden">
              @if (release.media_condition) {
                <span
                  class="px-1 py-px rounded font-bold bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800/50 shrink-0"
                  [appTooltip]="('collection.mediaCondition' | translate) + ': ' + release.media_condition"
                >
                  💿 {{ getConditionShortCode(release.media_condition) }}
                </span>
              }
              @if (release.sleeve_condition) {
                <span
                  class="px-1 py-px rounded font-bold bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800/50 shrink-0"
                  [appTooltip]="('collection.sleeveCondition' | translate) + ': ' + release.sleeve_condition"
                >
                  📁 {{ getConditionShortCode(release.sleeve_condition) }}
                </span>
              }
              @if (release.basic_information.median_price != null) {
                <span
                  class="px-1 py-px rounded font-bold bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/50 shrink-0"
                  [appTooltip]="'collection.estimatedValueTooltip' | translate"
                >
                  {{ release.basic_information.median_price | currency: 'EUR' : 'symbol' : '1.2-2' }}
                </span>
              }
            </span>
          }
        </span>

        <span class="shrink-0 flex flex-col items-end gap-1">
          <app-format-badge [format]="getFormatType(release)" [compact]="true" />
          @if (release.source === 'manual') {
            <app-manual-badge />
          }
          <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400" [title]="(release.listen_count || 0) + ' plays'">
            {{ release.listen_count || 0 }}×
          </span>
        </span>
      </button>
    </li>
  }
</ul>
