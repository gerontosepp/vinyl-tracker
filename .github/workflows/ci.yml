name: CI Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  backend-build:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
        server-id: ossindex
        server-username: OSSINDEX_USERNAME
        server-password: OSSINDEX_TOKEN
      env:
        OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
        OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}
        
    - name: Set up Maven
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: '3.9.9'
        
    - name: Check Docker
      run: docker info

    - name: Build and Test with Maven
      # The jacoco-check goal is bound to the verify phase, so 'mvn verify' will trigger the coverage check and fail if < 80%
      env:
        DOCKER_HOST: unix:///var/run/docker.sock
        OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
        OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}
      run: mvn clean verify -Psecurity-online -Dtest.integration.forkedProcessExitTimeoutInSeconds=120 -Dorg.slf4j.simpleLogger.log.org.testcontainers=debug

    - name: Extract project version
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      id: project_version
      run: |
        VERSION=$(jq -r .version ../frontend/package.json)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Project version is $VERSION"

    - name: Set up Docker Buildx
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/vinyl-tracker-backend
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          type=raw,value=v${{ steps.project_version.outputs.VERSION }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          type=semver,pattern={{version}}

    - name: Build and Push Backend Image
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels:  ${{ steps.meta.outputs.labels }}

  frontend-build:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Set up Chrome
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: stable
        install-dependencies: true

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: Run Karma Unit Tests
      # Runs Angular Karma unit tests with > 80% coverage check enforced via karma.conf.js
      run: npm run test -- --watch=false --code-coverage --browsers=ChromeHeadlessCI

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Ensure Development Certificates
      run: node scripts/ensure-certs.js

    - name: Run Playwright E2E Tests
      run: npm run test:e2e

    # We build the Docker image which includes the build step, so explicit 'npm run build' is redundant for the artifact if we just want the image.
    # But sticking to the pattern:
    
    - name: Extract project version
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      id: project_version
      run: |
        VERSION=$(jq -r .version package.json)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Project version is $VERSION"

    - name: Set up Docker Buildx
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/vinyl-tracker-frontend
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          type=raw,value=v${{ steps.project_version.outputs.VERSION }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          type=semver,pattern={{version}}

    - name: Build and Push Frontend Image
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        target: production
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  mcp-test:
    name: MCP Server Tests (Linux)
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: ./mcp

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./mcp -> ./mcp/target"

    - name: Run Cargo Check
      run: cargo check

    - name: Run Unit Tests
      run: cargo test --verbose

  mcp-release:
    name: MCP Server Release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            binary: vinyl-mcp-server
          - os: macos-latest
            target: macos-aarch64
            binary: vinyl-mcp-server
    defaults:
      run:
        working-directory: ./mcp

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./mcp -> ./mcp/target"

    - name: Build Release Binary
      run: cargo build --release

    - name: Package & Upload to GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ARCHIVE_NAME="vinyl-mcp-server-${{ matrix.target }}.tar.gz"
        tar -czf "../$ARCHIVE_NAME" -C target/release "${{ matrix.binary }}"
        gh release upload "${{ github.ref_name }}" "../$ARCHIVE_NAME" --clobber

  cleanup-ghcr:
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Delete old backend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'vinyl-tracker-backend'
          package-type: 'container'
          min-versions-to-keep: 3

      - name: Delete old frontend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'vinyl-tracker-frontend'
          package-type: 'container'
          min-versions-to-keep: 3



